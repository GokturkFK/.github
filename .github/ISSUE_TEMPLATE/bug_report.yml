name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        **Security notice:** If this is a security vulnerability, please do **not** open a public issue — follow our [Security Policy](https://github.com/GokturkFK/.github/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise summary of what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `...`
        2. Send request / trigger action `...`
        3. Observe error `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What you expected to happen and what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version (Go/Python/Docker), commit SHA or release tag.
      placeholder: |
        - OS: Ubuntu 24.04 / Windows 11
        - Version / Tag: v0.1.0
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Safety Check
      options:
        - label: I have removed all secrets, tokens, credentials, and private IPs from logs/screenshots.
          required: true
