name: Feature Request
description: Propose a new feature, capability, or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or gap does this proposal solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the desired behavior, interface, or design.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or trade-offs you considered.
    validations:
      required: false

  - type: textarea
    id: security
    attributes:
      label: Security & Compatibility Considerations
      description: Does this affect wire contracts, permissions, or threat models?
    validations:
      required: false
